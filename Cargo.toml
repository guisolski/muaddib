[package]
name = "muaddib"
version = "0.2.2"
edition = "2024"
rust-version = "1.93"
description = "AI-powered meta-search for your terminal"
authors = ["Guilherme Solski"]
license = "MIT"
repository = "https://github.com/guisolski/muaddib"
homepage = "https://github.com/guisolski/muaddib"
readme = "README.md"
keywords = ["tui", "search", "ai", "terminal", "ratatui"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
argon2 = "0.5"
chacha20poly1305 = "0.10"
clap = { version = "4.6.4", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
form_urlencoded = "1.2.2"
futures = "0.3.33"
getrandom = "0.3"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
ratatui = "0.30.2"
ratatui-image = { version = "11.0.6", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "http2"] }
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
toml = "1.1.4"
tui-input = "0.15.3"
zeroize = "1"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["test-util", "net", "io-util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
items_after_statements = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
similar_names = "allow"
implicit_hasher = "allow"
format_collect = "allow"
struct_excessive_bools = "allow"
cognitive_complexity = "warn"
