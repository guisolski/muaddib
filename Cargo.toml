[package]
name = "faro"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
description = "AI-powered meta-search for your terminal"
license = "MIT"
repository = "https://github.com/guisolski/faro"
readme = "README.md"
keywords = ["tui", "search", "ai", "terminal", "ratatui"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3.33"
ratatui = "0.30.2"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "http2"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "process", "sync", "time"] }
toml = "1.1.4"
tui-input = "0.15.3"

[features]
default = ["link-validation"]
link-validation = ["dep:reqwest"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
